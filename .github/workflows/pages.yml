name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source

      - name: Build static site
        working-directory: source
        env:
          SUPABASE_URL: https://api.201-51-7-193.sslip.io
          SUPABASE_ANON_KEY: sb_publishable_kWyPnUGXGMJ0afLvIdRNNr_j7tZjhXC
          SITE_BASE_URL: https://volzay.github.io/online-backgammon
        run: |
          npm ci
          npm run build

      - name: Prepare Pages artifact
        run: |
          tar -cvf "${RUNNER_TEMP}/github-pages" -C source/dist .

      - name: Download Pages runtime actions
        run: |
          git clone --depth=1 https://github.com/actions/upload-artifact.git .local-actions/upload-artifact
          git clone --depth=1 https://github.com/actions/deploy-pages.git .local-actions/deploy-pages

      - name: Extend Pages deployment timeout
        run: |
          node -e 'const fs = require("fs"); const path = ".local-actions/deploy-pages/dist/index.js"; const source = fs.readFileSync(path, "utf8"); const patched = source.replace("const MAX_TIMEOUT = 600000", "const MAX_TIMEOUT = 1800000"); if (patched === source) throw new Error("deploy-pages timeout marker not found"); fs.writeFileSync(path, patched);'

      - name: Upload Pages artifact
        uses: ./.local-actions/upload-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages
          archive: false
          retention-days: 1

      - name: Wait for artifact indexing
        run: sleep 15

      - name: Deploy GitHub Pages
        id: deployment
        uses: ./.local-actions/deploy-pages
        with:
          timeout: 1800000
          error_count: 100
          reporting_interval: 10000
