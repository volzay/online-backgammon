name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source

      - name: Build static site
        working-directory: source
        env:
          SUPABASE_URL: https://api.201-51-7-193.sslip.io
          SUPABASE_ANON_KEY: sb_publishable_kWyPnUGXGMJ0afLvIdRNNr_j7tZjhXC
          SITE_BASE_URL: https://volzay.github.io/online-backgammon
        run: |
          npm ci
          npm run build

      - name: Publish gh-pages branch
        working-directory: source/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Configure GitHub Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"source":{"branch":"gh-pages","path":"/"}}'
