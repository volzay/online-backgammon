name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, codex-temporary]
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source

      - name: Build static site
        working-directory: source
        env:
          SUPABASE_URL: https://api.201-51-7-193.sslip.io
          SUPABASE_ANON_KEY: sb_publishable_kWyPnUGXGMJ0afLvIdRNNr_j7tZjhXC
          SITE_BASE_URL: https://volzay.github.io/online-backgammon
        run: |
          npm ci
          npm run build

      - name: Prepare Pages artifact
        run: |
          tar -cvf "${RUNNER_TEMP}/artifact.tar" -C source/dist .

      - name: Download Pages runtime actions
        run: |
          git clone --depth=1 https://github.com/actions/upload-artifact.git .local-actions/upload-artifact
          git clone --depth=1 https://github.com/actions/deploy-pages.git .local-actions/deploy-pages

      - name: Upload Pages artifact
        uses: ./.local-actions/upload-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          archive: false
          retention-days: 1

      - name: Deploy GitHub Pages
        uses: ./.local-actions/deploy-pages
